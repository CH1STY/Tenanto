# Docker setup for the Tenant App. Only Next.js starts by default.
# Set MONGODB_URI to an existing MongoDB replica set (host, network, or Atlas).
#
# Quick start (app + existing MongoDB):
#   docker compose up -d --build
#   docker compose --profile seed run --rm seed   # one-time: create SuperAdmin
#
# Optional local-development MongoDB: npm run db:up
# The local `mongo` is an opt-in single-node replica set (rs0).
services:
  mongo:
    image: mongo:7
    profiles: ["local-db"]
    container_name: tenant-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - tenant-mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) }",
        ]
      interval: 5s
      timeout: 30s
      start_period: 5s
      retries: 30

  app:
    image: ${APP_IMAGE:-tenant-app-app}
    build:
      context: .
      target: runner
    container_name: tenant-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI to an existing MongoDB replica set in your .env file}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in your .env file}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      NODE_ENV: production
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login', { signal: AbortSignal.timeout(5000), redirect: 'manual' }).then(r => { if (r.status !== 200) throw new Error('Health check HTTP ' + r.status); }).catch(error => { console.error(error); process.exit(1); })",
        ]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 10
  # One-off seeding job. Run with:
  #   docker compose --profile seed run --rm seed
  seed:
    build:
      context: .
      target: seeder
    profiles: ["seed"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI to an existing MongoDB replica set in your .env file}
      SEED_SUPERADMIN_NAME: ${SEED_SUPERADMIN_NAME:-Super Admin}
      # The seed script validates these only when the one-off job runs.
      SEED_SUPERADMIN_EMAIL: ${SEED_SUPERADMIN_EMAIL:-}
      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:-}
volumes:
  tenant-mongo-data:
