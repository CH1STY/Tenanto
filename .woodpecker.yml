when:
  - event: [push, pull_request, manual]
    branch: main

labels:
  backend: docker

steps:
  - name: checks
    image: node:22-alpine
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      # Build-time validation only; production values are supplied at runtime.
      MONGODB_URI: mongodb://127.0.0.1:27017/tenant_app
    commands:
      - npm ci
      - npm run lint
      - npx --no-install next typegen
      - npx --no-install tsc --noEmit
      - npm run build

  - name: docker-build
    image: docker:29-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build --target runner --tag "tenanto:$${CI_COMMIT_SHA}" .
    when:
      - event: [push, manual]
        branch: main

  - name: deploy
    image: docker:29-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      MONGODB_URI:
        from_secret: MONGODB_URI
      AUTH_SECRET:
        from_secret: AUTH_SECRET
      AUTH_URL:
        from_secret: AUTH_URL
    commands:
      - |
        set -eu
        : "$${MONGODB_URI:?Woodpecker secret MONGODB_URI must be set}"
        : "$${AUTH_SECRET:?Woodpecker secret AUTH_SECRET must be set}"
        : "$${AUTH_URL:?Woodpecker secret AUTH_URL must be set}"
        export APP_IMAGE="tenanto:$${CI_COMMIT_SHA}"
        docker compose --env-file /dev/null --project-name tenanto up \
          --detach --no-build --wait --wait-timeout 180 app
    when:
      - event: [push, manual]
        branch: main
